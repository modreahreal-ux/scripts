name: Build Curtana NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update -y || true
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev libsqlite3-dev libgmp-dev libmpfr-dev libmpc-dev libffi-dev zip unzip ccache dtc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 https://github.com/xiaomi-miatoll/android_kernel_xiaomi_miatoll -b lineage-19.1 kernel
          cd kernel
          git clone https://github.com/aircrack-ng/rtl8812au.git drivers/net/wireless/rtl8812au

      - name: Configure and Build
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          make curtana_defconfig
          
          scripts/config --enable CONFIG_CFG80211
          scripts/config --enable CONFIG_MAC80211
          scripts/config --enable CONFIG_CFG80211_WEXT
          scripts/config --module CONFIG_ATH9K_HTC
          scripts/config --module CONFIG_RT2800USB
          scripts/config --module CONFIG_MT7601U
          scripts/config --module CONFIG_RTL8812AU
          
          make -j$(nproc)

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Curtana_Kernel_Image
          path: kernel/arch/arm64/boot/Image.gz-dtb
